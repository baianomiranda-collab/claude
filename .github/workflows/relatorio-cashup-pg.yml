name: Relatorio Orcamentos Cash-UP PG

on:
  # O `schedule:` nativo do GitHub Actions foi removido em 29/08/2026 -- o disparo diario
  # (18h07 Brasilia) agora vem do workflow n8n "Disparo Cash-UP PG/PQ (GitHub Actions)"
  # (organon12.app.n8n.cloud), que chama a API workflow_dispatch no horario certo. O
  # `schedule:` nativo podia atrasar horas (ja visto ~6h) em dias de pouca atividade do repo.
  # NAO reativar o `schedule:` aqui sem desativar o agendamento no n8n -- rodaria em dobro.
  workflow_dispatch:  # permite execução manual pelo GitHub OU via n8n

jobs:
  run-relatorio-cashup:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r GRUPOPQ/PROJETOS/relatorio_cashup_PG/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validar secrets configurados
        run: |
          faltando=""
          check() { if [ -z "$2" ]; then faltando="$faltando $1"; fi; }
          check CASHUP_PG_URL "${{ secrets.CASHUP_PG_URL }}"
          check CASHUP_PG_USER "${{ secrets.CASHUP_PG_USER }}"
          check CASHUP_PG_PASS "${{ secrets.CASHUP_PG_PASS }}"
          check CASHUP_WEBMAIL_PG_USER "${{ secrets.CASHUP_WEBMAIL_PG_USER }}"
          check CASHUP_WEBMAIL_PG_PASS "${{ secrets.CASHUP_WEBMAIL_PG_PASS }}"
          check CASHUP_WEBMAIL_GMAIL_PG_USER "${{ secrets.CASHUP_WEBMAIL_GMAIL_PG_USER }}"
          check CASHUP_WEBMAIL_GMAIL_PG_PASS "${{ secrets.CASHUP_WEBMAIL_GMAIL_PG_PASS }}"
          check CASHUP_EMAIL_PARA_PG "${{ secrets.CASHUP_EMAIL_PARA_PG }}"
          if [ -n "$faltando" ]; then
            echo "ERRO: os seguintes secrets do repositorio estao vazios ou nao existem:$faltando"
            echo "Configure em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Todos os secrets necessarios estao configurados."

          faltando_whatsapp=""
          if [ -z "${{ secrets.MEGAAPI_TOKEN }}" ]; then faltando_whatsapp="$faltando_whatsapp MEGAAPI_TOKEN"; fi
          if [ -z "${{ secrets.MEGAAPI_WHATSAPP_DESTINO }}" ]; then faltando_whatsapp="$faltando_whatsapp MEGAAPI_WHATSAPP_DESTINO"; fi
          if [ -n "$faltando_whatsapp" ]; then
            echo "AVISO: secrets do aviso por WhatsApp ausentes ($faltando_whatsapp) -- o relatorio"
            echo "roda normalmente, mas os avisos de sucesso/falha por WhatsApp nao serao enviados."
          fi

          if [ -z "${{ secrets.N8N_WEBHOOK_PG_CONCLUIDO }}" ]; then
            echo "AVISO: secret N8N_WEBHOOK_PG_CONCLUIDO ausente -- o relatorio roda normalmente,"
            echo "mas a PQ NAO vai disparar em seguida (ela so dispara via esse webhook agora)."
          fi

      - name: Criar arquivo .env com credenciais
        run: |
          cat > GRUPOPQ/PROJETOS/relatorio_cashup_PG/.env << 'EOF'
          CASHUP_PG_URL=${{ secrets.CASHUP_PG_URL }}
          CASHUP_PG_USER=${{ secrets.CASHUP_PG_USER }}
          CASHUP_PG_PASS=${{ secrets.CASHUP_PG_PASS }}
          CASHUP_WEBMAIL_PG_USER=${{ secrets.CASHUP_WEBMAIL_PG_USER }}
          CASHUP_WEBMAIL_PG_PASS=${{ secrets.CASHUP_WEBMAIL_PG_PASS }}
          CASHUP_WEBMAIL_GMAIL_PG_USER=${{ secrets.CASHUP_WEBMAIL_GMAIL_PG_USER }}
          CASHUP_WEBMAIL_GMAIL_PG_PASS=${{ secrets.CASHUP_WEBMAIL_GMAIL_PG_PASS }}
          CASHUP_EMAIL_PARA_PG=${{ secrets.CASHUP_EMAIL_PARA_PG }}
          EOF

      - name: Executar relatório de orçamentos
        run: python GRUPOPQ/PROJETOS/relatorio_cashup_PG/relatorio_cashup.py

      - name: Avisar WhatsApp - sucesso
        if: success()
        env:
          MEGAAPI_TOKEN: ${{ secrets.MEGAAPI_TOKEN }}
          MEGAAPI_DESTINO: ${{ secrets.MEGAAPI_WHATSAPP_DESTINO }}
        run: |
          http_code=$(curl -s -o /tmp/whatsapp_resp.json -w "%{http_code}" -X POST "https://apinocode01.megaapi.com.br/rest/sendMessage/megacode-M8WFF7YG9U9BDPT6GQ3D7LBWGAV/text" \
            -H "Authorization: Bearer $MEGAAPI_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messageData\": {\"to\": \"$MEGAAPI_DESTINO\", \"text\": \"✅ Cash-UP PG: relatorio enviado com sucesso.\"}}")
          if ! [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::warning::Aviso de WhatsApp (sucesso) pode NAO ter sido entregue -- MegaAPI respondeu HTTP '$http_code'. Corpo: $(cat /tmp/whatsapp_resp.json 2>/dev/null || echo '(sem resposta)')"
          else
            echo "Aviso de WhatsApp (sucesso) enviado -- MegaAPI respondeu HTTP $http_code."
          fi

      - name: Avisar WhatsApp - falha
        if: failure()
        env:
          MEGAAPI_TOKEN: ${{ secrets.MEGAAPI_TOKEN }}
          MEGAAPI_DESTINO: ${{ secrets.MEGAAPI_WHATSAPP_DESTINO }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          http_code=$(curl -s -o /tmp/whatsapp_resp.json -w "%{http_code}" -X POST "https://apinocode01.megaapi.com.br/rest/sendMessage/megacode-M8WFF7YG9U9BDPT6GQ3D7LBWGAV/text" \
            -H "Authorization: Bearer $MEGAAPI_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messageData\": {\"to\": \"$MEGAAPI_DESTINO\", \"text\": \"❌ Cash-UP PG: FALHOU. Log: $RUN_URL\"}}")
          if ! [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::warning::Aviso de WhatsApp (falha) pode NAO ter sido entregue -- MegaAPI respondeu HTTP '$http_code'. Corpo: $(cat /tmp/whatsapp_resp.json 2>/dev/null || echo '(sem resposta)')"
          else
            echo "Aviso de WhatsApp (falha) enviado -- MegaAPI respondeu HTTP $http_code."
          fi

      - name: Avisar n8n (dispara a PQ em sequencia)
        if: always()
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_PG_CONCLUIDO }}
          CONCLUSAO: ${{ job.status }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "N8N_WEBHOOK_PG_CONCLUIDO nao configurado -- pulando aviso ao n8n."
          else
            http_code=$(curl -s -o /tmp/n8n_resp.json -w "%{http_code}" -X POST "$N8N_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"projeto\": \"PG\", \"conclusion\": \"$CONCLUSAO\"}")
            if ! [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::warning::Webhook do n8n (dispara a PQ) pode ter falhado -- HTTP '$http_code'. A PQ pode NAO disparar hoje. Corpo: $(cat /tmp/n8n_resp.json 2>/dev/null || echo '(sem resposta)')"
            else
              echo "Webhook do n8n chamado com sucesso -- HTTP $http_code (PQ deve disparar em seguida)."
            fi
          fi

      - name: Upload screenshots de debug (se houve falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-cashup-pg-${{ github.run_id }}
          path: GRUPOPQ/PROJETOS/relatorio_cashup_PG/debug/
          retention-days: 14
          if-no-files-found: ignore

name: Relatorio Orcamentos Cash-UP PQ

on:
  # O `schedule:` nativo do GitHub Actions foi removido em 29/08/2026 -- o disparo diario
  # (18h23 Brasilia) agora vem do workflow n8n "Disparo Cash-UP PG/PQ (GitHub Actions)"
  # (organon12.app.n8n.cloud), que chama a API workflow_dispatch no horario certo. O
  # `schedule:` nativo podia atrasar horas (ja visto ~6h) em dias de pouca atividade do repo.
  # NAO reativar o `schedule:` aqui sem desativar o agendamento no n8n -- rodaria em dobro.
  workflow_dispatch:  # permite execução manual pelo GitHub OU via n8n

jobs:
  run-relatorio-cashup-pq:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r GRUPOPQ/PROJETOS/relatorio_cashup_PQ/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validar secrets configurados
        run: |
          faltando=""
          check() { if [ -z "$2" ]; then faltando="$faltando $1"; fi; }
          check CASHUP_PQ_URL "${{ secrets.CASHUP_PQ_URL }}"
          check CASHUP_PQ_USER "${{ secrets.CASHUP_PQ_USER }}"
          check CASHUP_PQ_PASS "${{ secrets.CASHUP_PQ_PASS }}"
          check CASHUP_WEBMAIL_PQ_USER "${{ secrets.CASHUP_WEBMAIL_PQ_USER }}"
          check CASHUP_WEBMAIL_PQ_PASS "${{ secrets.CASHUP_WEBMAIL_PQ_PASS }}"
          check CASHUP_WEBMAIL_GMAIL_PQ_USER "${{ secrets.CASHUP_WEBMAIL_GMAIL_PQ_USER }}"
          check CASHUP_WEBMAIL_GMAIL_PQ_PASS "${{ secrets.CASHUP_WEBMAIL_GMAIL_PQ_PASS }}"
          check CASHUP_EMAIL_PARA_PQ "${{ secrets.CASHUP_EMAIL_PARA_PQ }}"
          if [ -n "$faltando" ]; then
            echo "ERRO: os seguintes secrets do repositorio estao vazios ou nao existem:$faltando"
            echo "Configure em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Todos os secrets necessarios estao configurados."

      - name: Criar arquivo .env com credenciais
        run: |
          cat > GRUPOPQ/PROJETOS/relatorio_cashup_PQ/.env << 'EOF'
          CASHUP_PQ_URL=${{ secrets.CASHUP_PQ_URL }}
          CASHUP_PQ_USER=${{ secrets.CASHUP_PQ_USER }}
          CASHUP_PQ_PASS=${{ secrets.CASHUP_PQ_PASS }}
          CASHUP_WEBMAIL_PQ_USER=${{ secrets.CASHUP_WEBMAIL_PQ_USER }}
          CASHUP_WEBMAIL_PQ_PASS=${{ secrets.CASHUP_WEBMAIL_PQ_PASS }}
          CASHUP_WEBMAIL_GMAIL_PQ_USER=${{ secrets.CASHUP_WEBMAIL_GMAIL_PQ_USER }}
          CASHUP_WEBMAIL_GMAIL_PQ_PASS=${{ secrets.CASHUP_WEBMAIL_GMAIL_PQ_PASS }}
          CASHUP_EMAIL_PARA_PQ=${{ secrets.CASHUP_EMAIL_PARA_PQ }}
          EOF

      - name: Executar relatório de orçamentos
        run: python GRUPOPQ/PROJETOS/relatorio_cashup_PQ/relatorio_cashup.py

      - name: Upload screenshots de debug (se houve falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-cashup-pq-${{ github.run_id }}
          path: GRUPOPQ/PROJETOS/relatorio_cashup_PQ/debug/
          retention-days: 14
          if-no-files-found: ignore

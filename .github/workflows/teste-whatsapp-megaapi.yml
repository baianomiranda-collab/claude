name: Teste envio WhatsApp (MegaAPI)

# Workflow temporario de diagnostico -- criado em 05/09/2026 para confirmar se o token/instancia
# MegaAPI Organon (usado pelos avisos do Cash-UP PG/PQ) ainda esta autenticando corretamente.
# Ao contrario dos steps de aviso do Cash-UP, este AQUI falha o job se o MegaAPI nao responder 2xx --
# assim da pra saber pelo status do run (sem precisar ler log) se o envio realmente funcionou.
# Seguro apagar este arquivo depois do teste.

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets
        run: |
          faltando=""
          if [ -z "${{ secrets.MEGAAPI_TOKEN }}" ]; then faltando="$faltando MEGAAPI_TOKEN"; fi
          if [ -z "${{ secrets.MEGAAPI_WHATSAPP_DESTINO }}" ]; then faltando="$faltando MEGAAPI_WHATSAPP_DESTINO"; fi
          if [ -n "$faltando" ]; then
            echo "ERRO: secrets ausentes:$faltando"
            exit 1
          fi

      - name: Testar envio via MegaAPI (checa HTTP de verdade)
        env:
          MEGAAPI_TOKEN: ${{ secrets.MEGAAPI_TOKEN }}
          MEGAAPI_DESTINO: ${{ secrets.MEGAAPI_WHATSAPP_DESTINO }}
        run: |
          agora=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          http_code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            "https://apinocode01.megaapi.com.br/rest/sendMessage/megacode-M8WFF7YG9U9BDPT6GQ3D7LBWGAV/text" \
            -H "Authorization: Bearer $MEGAAPI_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"messageData\": {\"to\": \"$MEGAAPI_DESTINO\", \"text\": \"Teste de diagnostico - MegaAPI Organon ($agora UTC)\"}}")
          echo "HTTP_CODE=$http_code"
          echo "Corpo da resposta:"
          cat /tmp/resp.json || true
          echo ""
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "FALHA: MegaAPI respondeu HTTP $http_code (nao é 2xx) -- token/instancia provavelmente invalido ou desconectado."
            exit 1
          fi
          echo "OK: MegaAPI aceitou o envio (HTTP $http_code)."
